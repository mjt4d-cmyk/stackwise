<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackwise</title>
<meta name="theme-color" content="#14202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stackwise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
/* Single dark look, matching the app's dark header. Stage is the 390px-wide phone design, scaled to fit. */
:root { --ink: #14202B; --ground: #14202B; color-scheme: dark; }
html, body { height: 100%; }
/* Edges outside the app (status bar, Safari toolbars, home bar) match the app: dark header on top, light drawer below */
html { background: linear-gradient(to bottom, #14202B 0%, #14202B 50%, #F4F6F8 50%, #F4F6F8 100%); background-attachment: fixed; }
body { margin: 0; background: transparent; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
#viewport { position: fixed; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; background: transparent; }
#safe-probe { position: fixed; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#app { box-sizing: content-box; }
#stage { position: absolute; top: 0; width: 390px; transform-origin: 0 0; touch-action: manipulation; }
#app > div { border-radius: 0 !important; }
html:has(body.framed) { background: #E9E8E4; }
body.framed, body.framed #viewport { background: #E9E8E4; }
body.framed #stage { border-radius: 40px; overflow: hidden; box-shadow: 0 24px 60px rgba(20, 32, 43, 0.28), 0 0 0 1px rgba(20, 32, 43, 0.08); }
button, input, select { font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #F0B48C; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #app * { transition: none !important; } }

body{margin:0;background:#E9EDF1}
a{color:#9A4A1A}a:hover{color:#6E3410}
button{font-family:inherit;cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:focus{outline:2px solid #14202B;outline-offset:1px}
.carousel{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
@keyframes swIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sw-in{animation:swIn 420ms cubic-bezier(0.2,0.8,0.2,1) both}
@keyframes swThumbR{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes swThumbL{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.sw-in{animation:none}}

</style>
</head>
<body>
<div id="safe-probe"></div>
<div id="viewport"><div id="stage"><div id="app"></div></div></div>
<template id="tpl">
<div style="position: relative; width: 390px; height: {{appH}}px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F8; color: #14202B; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">

<sc-if value="{{isStart}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: {{appH}}px; overflow: hidden; background: #14202B; color: #FFFFFF">
  <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 28px; top: {{logoTop}}px; transform-origin: 0 0; transform: {{logoTf}}; transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1)"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
  <h1 style="position: absolute; left: 28px; top: {{titleTop}}px; margin: 0; white-space: nowrap; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 48px; line-height: 1; letter-spacing: -0.02em; color: #FFFFFF; transform-origin: 0 0; transform: {{titleTf}}; transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1)">Stackwise</h1>
  <p style="position: absolute; left: 28px; right: 28px; top: {{taglineTop}}px; margin: 0; font-size: 20px; line-height: 1.35; color: #D6DDE3; opacity: {{taglineOpacity}}; transition: opacity 220ms ease">Count your boxes. Find the right truck or storage unit.</p>

  <div aria-hidden="true" style="position: absolute; left: 20px; top: 20px; pointer-events: none; opacity: {{ghostOpacity}}; transition: opacity 280ms ease 220ms">
    <sc-if value="{{ghostBack}}" hint-placeholder-val="{{ false }}">
      <span style="min-height: 52px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px; color: #FFFFFF; font-size: 17px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back</span>
    </sc-if>
    <sc-if value="{{ghostStart}}" hint-placeholder-val="{{ false }}">
      <span style="min-height: 52px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Start over</span>
    </sc-if>
  </div>
  <sc-if value="{{ghostStart}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 84px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; pointer-events: none; opacity: {{ghostOpacity}}; transition: opacity 280ms ease 220ms">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{cuSize}}px; line-height: 0.78; padding-top: 2px; letter-spacing: -0.02em; color: #F0B48C; white-space: nowrap; transition: font-size 400ms cubic-bezier(0.2, 0.8, 0.2, 1)">{{needed}}<span style="margin-left: 6px; font-size: 18px; letter-spacing: 0">cu ft</span></span>
      <span style="flex: none; min-height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.14); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px">View details<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: {{sheetTop}}px; box-sizing: border-box; padding: 10px 20px 36px; background: {{sheetBg}}; color: #14202B; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; transition: top 520ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 520ms ease">
    <div aria-hidden="true" style="flex: none; align-self: center; width: 48px; height: 5px; border-radius: 3px; background: #C9D2DB"></div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; margin: 18px -20px 0; padding: 0 20px 8px; display: flex; flex-direction: column; gap: 14px; opacity: {{upOpacity}}; transition: opacity 180ms ease">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #14202B; padding: 0 4px">How do you want to start?</span>
    <button type="button" onClick="{{startBoxes}}" aria-pressed="{{boxesSelStr}}" style="min-height: 112px; padding: 18px 16px; border: {{boxesCard.border}}; border-radius: 22px; background: {{boxesCard.bg}}; color: #14202B; display: flex; align-items: center; gap: 14px; text-align: left">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 14px; background: #E9EDF1; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; line-height: 1.1; white-space: nowrap">Count my boxes</span>
        <span style="font-size: 15px; line-height: 1.3; color: {{boxesCard.subColor}}; font-weight: {{boxesCard.subWeight}}">{{boxesCard.sub}}</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button type="button" onClick="{{startPreset}}" aria-pressed="{{presetSelStr}}" style="min-height: 112px; padding: 18px 16px; border: {{presetCard.border}}; border-radius: 22px; background: {{presetCard.bg}}; color: #14202B; display: flex; align-items: center; gap: 14px; text-align: left">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 14px; background: #E9EDF1; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; line-height: 1.1; white-space: nowrap">Start with a preset</span>
        <span style="font-size: 15px; line-height: 1.3; color: {{presetCard.subColor}}; font-weight: {{presetCard.subWeight}}">{{presetCard.sub}}</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <sc-if value="{{hasSaved}}" hint-placeholder-val="{{ false }}">
      <span style="margin-top: 6px; padding: 0 4px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5866">Saved moves</span>
      <sc-for list="{{savedRows}}" as="sv" hint-placeholder-count="2">
        <div style="flex: none; display: flex; align-items: stretch; gap: 8px">
          <button type="button" onClick="{{sv.open}}" style="flex: 1; min-width: 0; min-height: 68px; padding: 10px 14px; border: 2px solid #DCE2E8; border-radius: 16px; background: #F4F6F8; color: #14202B; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px">
            <span style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sv.name}}</span>
            <span style="font-size: 14px; color: #4A5866; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sv.summary}}</span>
          </button>
          <button type="button" onClick="{{sv.remove}}" aria-label="Delete {{sv.label}}" style="flex: none; width: 60px; border: 2px solid #DCE2E8; border-radius: 16px; background: #FFFFFF; color: #8A3F15; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg></button>
        </div>
      </sc-for>
    </sc-if>
    <sc-if value="{{started}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{clearAll}}" style="min-height: 56px; border: 2px solid #C9D2DB; border-radius: 16px; background: #FFFFFF; color: #14202B; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>Clear selections</button>
    </sc-if>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{isPresetPick}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: {{appH}}px; background: #14202B">
  <div style="flex: none; padding: 20px 20px 26px; background: #14202B; color: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
    <span style="flex: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Stackwise</span>
    <button type="button" onClick="{{goStart}}" style="order: -1; margin-right: auto; flex: none; min-height: 52px; padding: 0 4px; border: none; background: transparent; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>{{ppBackLabel}}</button>
    <div aria-hidden="true" style="flex: 1 1 100%; box-sizing: border-box; height: {{ppTotalsH}}px; padding-top: 22px; opacity: {{ppTotalsOpacity}}; overflow: hidden; pointer-events: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; transition: height 460ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 320ms ease 120ms">
      <span style="padding-top: 2px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 42px; line-height: 0.78; letter-spacing: -0.02em; color: #F0B48C; white-space: nowrap">{{ppNeeded}}<span style="margin-left: 6px; font-size: 18px; letter-spacing: 0">cu ft</span></span>
      <span style="flex: none; min-height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.14); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px">View details<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(90deg)"><path d="M9 6l6 6-6 6"></path></svg></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; margin-top: -16px; display: flex; flex-direction: column; background: #F4F6F8; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35); overflow: hidden; position: relative">
  <div aria-hidden="true" style="flex: none; align-self: center; width: 48px; height: 5px; border-radius: 3px; background: #C9D2DB; margin-top: 10px"></div>
  <div style="flex: none; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 4px; opacity: {{ppListOpacity}}; transform: translateY({{ppListShift}}px); transition: opacity 240ms ease, transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1)">
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1">Pick a home size</h2>
    <p style="margin: 0; font-size: 17px; color: #4A5866">We’ll fill in typical box counts. You can adjust them next.</p>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 12px; opacity: {{ppListOpacity}}; transform: translateY({{ppListShift}}px); transition: opacity 240ms ease 40ms, transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1) 40ms">
    <sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
      <button type="button" onClick="{{p.start}}" style="flex: none; min-height: 96px; padding: 12px 16px; border: 2px solid #DCE2E8; border-radius: 20px; background: #FFFFFF; color: #14202B; display: flex; align-items: center; gap: 16px; text-align: left">
        <span style="flex: none; width: 72px; height: 64px; border-radius: 14px; background: #F4F6F8; display: flex; align-items: center; justify-content: center"><svg width="56" height="42" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">{{p.label}}</span>
          <span style="font-size: 16px; color: #4A5866">{{p.sub}}</span>
        </span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>
  </div>
</div>
</sc-if>

<sc-if value="{{isCount}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: {{appH}}px; background: #14202B">
  <div style="flex: none; padding: 20px 20px 26px; background: #14202B; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
      <h1 style="flex: none; margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Stackwise</h1>
      <button type="button" onClick="{{goStart}}" style="order: -1; margin-right: auto; flex: none; min-height: 52px; padding: 0 4px; border: none; background: transparent; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Start over</button>
    </div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{cuSize}}px; line-height: 0.78; padding-top: 2px; letter-spacing: -0.02em; color: #F0B48C; white-space: nowrap; transition: font-size 400ms cubic-bezier(0.2, 0.8, 0.2, 1)">{{needed}}<span style="margin-left: 6px; font-size: 18px; letter-spacing: 0">cu ft</span></span>
      <button type="button" onClick="{{toggleDetails}}" aria-expanded="{{detailsExpanded}}" style="flex: none; min-height: 48px; padding: 0 12px 0 16px; border: none; border-radius: 14px; background: rgba(255, 255, 255, 0.14); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{detailsLabel}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{detailsChevron}}; transition: transform 300ms ease"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div style="flex: none; width: 100%; height: {{detailsMax}}px; opacity: {{detailsOpacity}}; overflow: hidden; transition: height 480ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 320ms ease">
      <div style="height: 100%; box-sizing: border-box; padding-bottom: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 4px">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #B9C4CE">Recommendation</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.06)">
            <span style="width: 44px; height: 44px; border-radius: 12px; background: rgba(240, 180, 140, 0.16); color: #F0B48C; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h13v11H1z"></path><path d="M14 9h4l3 3v4h-7z"></path><circle cx="5.5" cy="18.5" r="2"></circle><circle cx="17.5" cy="18.5" r="2"></circle></svg></span>
            <span style="margin-top: 4px; font-size: 14px; color: #B9C4CE">Moving truck</span>
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; color: #FFFFFF">{{recTruck.name}}</span>
            <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; line-height: 1; letter-spacing: 0; white-space: nowrap; color: #F0B48C">{{recTruck.big}}</span>
            <div role="img" aria-label="{{recTruck.barLabel}}" style="height: 12px; margin: 2px 0 4px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden"><div style="height: 12px; width: {{recTruck.pct}}%; border-radius: 6px; background: {{recTruck.barColor}}; transition: width 400ms ease"></div></div>
            <span style="font-size: 13px; line-height: 1.3; color: #D6DDE3">{{recTruck.note}}</span>
          </div>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.06)">

, W, H], [0, W, H]]),\n        right: poly(P, [[L, 0, 0], [L, W, 0], [L, W, H], [L, 0, H]]),\n        tapeTop: poly(P, [[0, m - t, H], [L, m - t, H], [L, m + t, H], [0, m + t, H]]),\n        tapeSide: poly(P, [[L, m - t, H], [L, m + t, H], [L, m + t, H * 0.72], [L, m - t, H * 0.72]]),\n        shadow: ((L + W) * C * sc / 2 + 2).toFixed(1),\n        cTop: furniture ? '#C3CDD6' : '#E6B983',\n        cLeft: furniture ? '#97A4B0' : '#C98F55',\n        cRight: furniture ? '#75838F' : '#A66F3B',\n        cTape: furniture ? 'none' : '#F4E1BF',\n        edge: furniture ? '#4A5866' : '#6E4520'\n      };\n    };\n\n    const TYPES = [\n      { key: 'small', abbr: 'S', label: 'Small box', dims: '16 \u00d7 12 \u00d7 12 in', l: 16, w: 12, h: 12 },\n      { key: 'medium', abbr: 'M', label: 'Medium box', dims: '18 \u00d7 18 \u00d7 16 in', l: 18, w: 18, h: 16 },\n      { key: 'large', abbr: 'L', label: 'Large box', dims: '18 \u00d7 18 \u00d7 24 in', l: 18, w: 18, h: 24 },\n      { key: 'xl', abbr: 'XL', label: 'Extra-large box', dims: '24 \u00d7 18 \u00d7 24 in', l: 24, w: 18, h: 24 },\n      { key: 'wardrobe', abbr: 'W', label: 'Wardrobe box', dims: '24 \u00d7 21 \u00d7 46 in', l: 24, w: 21, h: 46 },\n      { key: 'dish', abbr: 'D', label: 'Dish pack', dims: '18 \u00d7 18 \u00d7 28 in', l: 18, w: 18, h: 28 },\n      { key: 'furniture', abbr: 'F', label: 'Furniture pieces', dims: 'rough average', l: 48, w: 30, h: 30, furniture: true }\n    ];\n    TYPES.forEach((t) => { t.vol = t.l * t.w * t.h / 1728; });\n    const PRESET_ICONS = {\n      studio: 'M6 34h36 M17 34V14h14v20 M20 18h3v3h-3z M25 18h3v3h-3z M22 34v-6h4v6',\n      '1br': 'M6 34h36 M17 34V6h14v28 M20 10h3v3h-3z M25 10h3v3h-3z M20 16h3v3h-3z M25 16h3v3h-3z M20 22h3v3h-3z M25 22h3v3h-3z M22 34v-5h4v5',\n      '2br': 'M4 34h40 M9 34V4h14v30 M23 34V12h15v22 M12 8h3v3h-3z M17 8h3v3h-3z M12 14h3v3h-3z M17 14h3v3h-3z M12 20h3v3h-3z M17 20h3v3h-3z M27 16h3v3h-3z M32 16h3v3h-3z M27 22h3v3h-3z M32 22h3v3h-3z M14 34v-5h4v5',\n      '2bh': 'M6 34h36 M13 34V20 M35 34V20 M9 23l15-12 15 12 M21 34v-7h6v7 M16 24h3v3h-3z M29 24h3v3h-3z',\n      '3br': 'M2 34h44 M8 34V19 M40 34V19 M4 22l20-15 20 15 M32 13V6h4v10 M21 34v-8h6v8 M12 23h4v4h-4z M32 23h4v4h-4z',\n      '4br': 'M2 34h44 M5 34V16 M29 34V16 M2 18l15-12 15 12 M29 22h15v12 M29 22l7-5 8 5 M14 34v-7h6v7 M9 20h4v4h-4z M21 20h4v4h-4z M32 27h9v7'\n    };\n    const PRESETS = {\n      studio: { label: 'Studio apt', counts: { small: 8, medium: 10, large: 4, xl: 0, wardrobe: 1, dish: 1, furniture: 3 } },\n      '1br': { label: '1 bed apt', counts: { small: 12, medium: 18, large: 8, xl: 2, wardrobe: 2, dish: 2, furniture: 6 } },\n      '2br': { label: '2 bed apt', counts: { small: 18, medium: 28, large: 14, xl: 4, wardrobe: 3, dish: 3, furniture: 10 } },\n      '2bh': { label: '2 bed house', counts: { small: 20, medium: 32, large: 16, xl: 5, wardrobe: 3, dish: 3, furniture: 12 } },\n      '3br': { label: '3 bed house', counts: { small: 25, medium: 40, large: 20, xl: 6, wardrobe: 4, dish: 4, furniture: 15 } },\n      '4br': { label: '4+ bed house', counts: { small: 32, medium: 52, large: 26, xl: 8, wardrobe: 5, dish: 5, furniture: 20 } }\n    };\n    const TRUCKS = [\n      { name: 'Cargo van', cap: 250, sub: 'Dorm or small studio', l: 10, w: 5.5, h: 4.5 },\n      { name: '10 ft truck', cap: 400, sub: 'Studio to 1 bedroom', l: 10, w: 6.3, h: 6.3 },\n      { name: '15 ft truck', cap: 760, sub: '1 to 2 bedrooms', l: 15, w: 7.5, h: 6.8 },\n      { name: '20 ft truck', cap: 1000, sub: '2 to 3 bedrooms', l: 20, w: 7.5, h: 6.7 },\n      { name: '26 ft truck', cap: 1700, sub: '3 to 5 bedrooms', l: 26, w: 8.2, h: 8 }\n    ];\n    const STORAGE = [\n      { name: '5 \u00d7 5 unit', cap: 200, sub: 'Closet size', l: 5, w: 5, h: 8 },\n      { name: '5 \u00d7 10 unit', cap: 400, sub: 'Walk-in closet', l: 10, w: 5, h: 8 },\n      { name: '10 \u00d7 10 unit', cap: 800, sub: 'Half a garage', l: 10, w: 10, h: 8 },\n      { name: '10 \u00d7 15 unit', cap: 1200, sub: 'Small bedroom', l: 15, w: 10, h: 8 },\n      { name: '10 \u00d7 20 unit', cap: 1600, sub: 'One-car garage', l: 20, w: 10, h: 8 },\n      { name: '10 \u00d7 30 unit', cap: 2400, sub: 'Large garage', l: 30, w: 10, h: 8 }\n    ];\n\n    const setCount = (key, delta) => {\n      const next = Math.max(0, (s.counts[key] || 0) + delta);\n      this.setState({ counts: { ...this.state.counts, [key]: next }, preset: 'custom' });\n    };\n    const items = TYPES.map((t) => ({\n      label: t.label,\n      abbr: t.abbr,\n      dims: t.dims,\n      volStr: t.vol.toFixed(1),\n      count: s.counts[t.key] || 0,\n      countStr: s.counts[t.key] ? String(s.counts[t.key]) : '',\n      set: (e) => {\n        const v = parseInt(e.target.value, 10);\n        const next = isNaN(v) ? 0 : Math.max(0, Math.min(999, v));\n        this.setState({ counts: { ...this.state.counts, [t.key]: next }, preset: 'custom' });\n      },\n      iso: boxIso(t.l, t.w, t.h, !!t.furniture, t.abbr),\n      inc: () => setCount(t.key, 1),\n      dec: () => setCount(t.key, -1)\n    }));\n    let raw = 0, totalItems = 0;\n    TYPES.forEach((t) => { const c = s.counts[t.key] || 0; raw += c * t.vol; totalItems += c; });\n    const CUSTOMS = (s.customs || []).map((cu) => ({ ...cu, key: 'c' + cu.id, abbr: 'C', label: 'Custom item', custom: true, vol: cu.l * cu.w * cu.h / 1728 }));\n    CUSTOMS.forEach((cu) => { raw += cu.qty * cu.vol; totalItems += cu.qty; });\n    const updateCustom = (id, fn) => this.setState({ customs: this.state.customs.map((cu) => (cu.id === id ? fn(cu) : cu)) });\n    const numOrBlank = (v) => { const n = parseFloat(v); return isNaN(n) || n <= 0 ? 0 : n; };\n    const dl = numOrBlank(s.draft.l), dw = numOrBlank(s.draft.w), dh = numOrBlank(s.draft.h);\n    const dq = Math.max(1, Math.min(999, parseInt(s.draft.qty, 10) || 1));\n    const canAdd = dl > 0 && dw > 0 && dh > 0;\n    const setDraft = (f) => (e) => this.setState({ draft: { ...this.state.draft, [f]: e.target.value } });\n    const customRows = CUSTOMS.map((cu) => ({\n      dims: cu.l + ' \u00d7 ' + cu.w + ' \u00d7 ' + cu.h + ' in',\n      volStr: cu.vol.toFixed(1),\n      qtyStr: String(cu.qty),\n      label: 'custom item ' + cu.l + ' by ' + cu.w + ' by ' + cu.h + ' inches',\n      dec: () => updateCustom(cu.id, (x) => ({ ...x, qty: Math.max(1, x.qty - 1) })),\n      inc: () => updateCustom(cu.id, (x) => ({ ...x, qty: Math.min(999, x.qty + 1) })),\n      set: (e) => { const v = parseInt(e.target.value, 10); updateCustom(cu.id, (x) => ({ ...x, qty: isNaN(v) ? 1 : Math.max(1, Math.min(999, v)) })); },\n      remove: () => this.setState({ customs: this.state.customs.filter((x) => x.id !== cu.id) })\n    }));\n    const needed = Math.ceil(raw * (1 + buffer / 100));\n\n    // Pile: one neat stack per box type, tallest types at the back, smallest at the front\n    const MAX_DRAWN = 300;\n    let budget = MAX_DRAWN, totalBoxes = 0;\n    const groupsIn = TYPES.filter((t) => !t.furniture).concat(CUSTOMS)\n      .sort((a, b) => b.h - a.h || b.vol - a.vol)\n      .map((t) => {\n        const c = t.custom ? t.qty : (s.counts[t.key] || 0);\n        totalBoxes += c;\n        const d = Math.min(c, budget);\n        budget -= d;\n        const layersMax = Math.max(1, Math.floor(66 / t.h));\n        return { t, c, d, n: Math.ceil(d / layersMax) };\n      })\n      .filter((gp) => gp.d > 0);\n    const N = groupsIn.reduce((m, gp) => m + gp.d, 0);\n    const D = Math.max(1, Math.min(4, groupsIn.reduce((m, gp) => Math.max(m, Math.ceil(Math.sqrt(gp.n))), 1)));\n    const GAP = 10;\n    let gx = 0, spanY = 0, maxH = 0;\n    const placed = [];\n    const labelsIn = [];\n    groupsIn.forEach((gp, gi) => {\n      const t = gp.t;\n      const rows = Math.min(gp.n, D);\n      const colsX = Math.ceil(gp.n / rows);\n      const cx = t.l + 2, cy = t.w + 2;\n      for (let b = 0; b < gp.d; b++) {\n        const k = b % gp.n;\n        const ci = Math.floor(k / rows), cj = k % rows;\n        const z = Math.floor(b / gp.n) * t.h;\n        placed.push({ t, gi, ci, cj, z, x: gx + ci * cx + 1, y: cj * cy + 1 });\n        maxH = Math.max(maxH, z + t.h);\n      }\n      const gw = colsX * cx, gd = rows * cy;\n      labelsIn.push({ x: gx + gw / 2, y: gd, text: t.abbr + ' ' + gp.c });\n      spanY = Math.max(spanY, gd);\n      gx += gw + GAP;\n    });\n    const spanX = Math.max(0, gx - GAP);\n    placed.sort((a, b) => a.gi - b.gi || (a.ci + a.cj) - (b.ci + b.cj) || a.z - b.z);\n    const base = (x, y, z) => [(x - y) * C, (x + y) * 0.5 - z];\n    const corners = [[0, 0, 0], [spanX, 0, 0], [0, spanY, 0], [spanX, spanY, 0], [0, 0, maxH], [spanX, 0, maxH], [0, spanY, maxH], [spanX, spanY, -14]];\n    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;\n    corners.forEach((c) => { const q = base(c[0], c[1], c[2]); minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); });\n    const ps = Math.min(310 / (maxX - minX), 186 / (maxY - minY), 2.4);\n    const pox = (326 - (maxX - minX) * ps) / 2 - minX * ps;\n    const poy = 194 - maxY * ps;\n    const PP = (x, y, z) => { const q = base(x, y, z); return [pox + q[0] * ps, poy + q[1] * ps]; };\n    const pileBoxes = placed.map((p) => {\n      const x0 = p.x, y0 = p.y, z0 = p.z, x1 = p.x + p.t.l, y1 = p.y + p.t.w, z1 = p.z + p.t.h;\n      const m = (y0 + y1) / 2, tp = Math.min(2.2, p.t.w * 0.12);\n      return {\n        top: poly(PP, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]),\n        left: poly(PP, [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]),\n        right: poly(PP, [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]]),\n        tapeTop: poly(PP, [[x0, m - tp, z1], [x1, m - tp, z1], [x1, m + tp, z1], [x0, m + tp, z1]]),\n        tapeSide: poly(PP, [[x1, m - tp, z1], [x1, m + tp, z1], [x1, m + tp, z1 - p.t.h * 0.28], [x1, m - tp, z1 - p.t.h * 0.28]]),\n        letter: stencil(PP, p.t.abbr, (x0 + x1) / 2, y1, (z0 + z1) / 2, letterHeight(p.t.abbr, p
